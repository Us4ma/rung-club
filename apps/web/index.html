<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#092e26"><link rel="manifest" href="/manifest.webmanifest"><title>Rung Club · A seat at the table</title>
<style>
/* Original CSS card choreography. No font, artwork or script download required. */
html,body{margin:0;background:#071d16}#boot-screen{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;padding:24px;box-sizing:border-box;color:#f4e4bf;background:radial-gradient(ellipse at 50% 38%,#194d39 0%,#0b2c21 46%,#061810 100%);font-family:system-ui,-apple-system,sans-serif;text-align:center;opacity:1;transition:opacity .18s ease;overflow:hidden}#boot-screen:before{content:'';position:absolute;inset:16px;border:1px solid #bd9c4f38;border-radius:20px;pointer-events:none}.boot-content{position:relative;max-width:360px;width:100%}.boot-brand{font-family:Georgia,serif;font-size:clamp(27px,7vw,36px);letter-spacing:4px;margin:0;color:#f6dfaa;font-weight:400}.boot-brand b{font-weight:400;color:#c5a368}.boot-kicker{font-size:9px;letter-spacing:4px;color:#c2b587;margin:12px 0 0}.boot-deck{position:relative;width:200px;height:168px;margin:38px auto 16px;perspective:600px}.boot-card{position:absolute;left:57px;top:20px;width:84px;height:120px;border:1px solid #e7c878;border-radius:9px;background:linear-gradient(145deg,#255c45,#103528);box-shadow:0 10px 22px #0006,inset 0 0 0 4px #103428,inset 0 0 0 5px #b9954f;display:grid;place-items:center;color:#e8cc88;font:36px Georgia,serif;will-change:transform;animation:boot-shuffle 1.65s ease-in-out infinite;transform:rotate(-12deg)}.boot-card:after{content:'';position:absolute;inset:11px;border:1px solid #be9c5666;border-radius:4px}.boot-card:nth-child(2){animation-delay:-.55s;background:linear-gradient(145deg,#387354,#174332)}.boot-card:nth-child(3){animation-delay:-1.1s;background:linear-gradient(145deg,#306349,#123c2c)}#boot-message{font-size:12px;line-height:1.7;color:#d9d6bd;margin:0;min-height:21px}.boot-dots{display:flex;justify-content:center;gap:7px;margin:17px 0 28px}.boot-dots i{width:4px;height:4px;border-radius:50%;background:#d8bc74;animation:boot-pulse 1.2s ease-in-out infinite}.boot-dots i:nth-child(2){animation-delay:.2s}.boot-dots i:nth-child(3){animation-delay:.4s}.boot-note{color:#92ac97;font-size:10px;letter-spacing:1px;margin:0}#boot-retry{margin:18px auto 0;background:#163e2d;color:#f2d99d;border:1px solid #b79c62;border-radius:8px;padding:12px 22px;min-height:44px;font:inherit;font-size:12px;cursor:pointer}#boot-retry[hidden]{display:none}#boot-retry:focus-visible{outline:3px solid #ffe3a4;outline-offset:4px}#boot-screen.boot-complete{opacity:0;pointer-events:none}.boot-error .boot-card,.boot-error .boot-dots i{animation-play-state:paused}
@keyframes boot-shuffle{0%,100%{transform:translateX(-26px) translateY(3px) rotate(-14deg);z-index:1}33%{transform:translateX(40px) translateY(-10px) rotate(15deg);z-index:3}66%{transform:translateX(-3px) translateY(5px) rotate(-3deg);z-index:2}}@keyframes boot-pulse{0%,100%{opacity:.3}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){#boot-screen{transition:none}.boot-card{animation:none;transform:translateX(-30px) rotate(-12deg)}.boot-card:nth-child(2){transform:translateY(-6px);z-index:2}.boot-card:nth-child(3){transform:translateX(30px) rotate(12deg);z-index:3}.boot-dots i{animation:none;opacity:.7}}
@media(max-height:450px){.boot-deck{margin:14px auto 0;height:145px}.boot-kicker{margin-top:8px}.boot-dots{margin:10px 0}.boot-note{font-size:9px}#boot-screen:before{inset:10px}}
</style>
</head>
<body>
<section id="boot-screen" aria-label="Loading Rung Club"><div class="boot-content"><h1 class="boot-brand">RUNG <b>CLUB</b></h1><p class="boot-kicker">A SEAT AT THE TABLE</p><div class="boot-deck" aria-hidden="true"><span class="boot-card">♠</span><span class="boot-card">♣</span><span class="boot-card">♦</span></div><p id="boot-message" role="status" aria-live="polite">Shuffling a little company…</p><div class="boot-dots" aria-hidden="true"><i></i><i></i><i></i></div><p class="boot-note">GOOD CARDS. GREAT COMPANY.</p><button id="boot-retry" type="button" hidden>Try again</button><noscript><p>Enable JavaScript to enter the club.</p></noscript></div></section>
<div id="root" inert aria-hidden="true"></div><script type="module" src="/bootstrap.ts"></script>
</body>
</html>
